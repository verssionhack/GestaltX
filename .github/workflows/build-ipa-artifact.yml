name: Build IPA (Artifact)

# Builds the tagged release with the repo's own build script and uploads the
# ad-hoc signed IPA as a workflow artifact (no release upload).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        type: string
        required: false
        default: v1.0.4

jobs:
  build:
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag || 'v1.0.4' }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 1

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build IPA
        id: build
        run: ./.github/scripts/build-ipa.sh "$RUNNER_TEMP/ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GestaltX_${{ env.TAG }}
          path: ${{ steps.build.outputs.ipa }}